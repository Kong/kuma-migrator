# ---------------------------------------------------------------------------
# Built-in gateway
# ---------------------------------------------------------------------------

- kind: MeshGateway
  group: gateway
  product: kuma
  summary: Built-in gateway listeners (ports, protocols, hostnames, TLS) selected by a kuma.io/service tag.
  v2:
    status: converted
    output: [Gateway]
    notes: |
      Converted to a Gateway API `Gateway` named after the `MeshGateway`:

      - `conf.listeners[]` → `spec.listeners[]` (`name` is `<protocol>-<port>`, with a `-2`,
        `-3`, … suffix when two listeners share protocol and port; `hostname`, `tls.mode`
        recased, `certificates[].secret` → `certificateRefs[]`).
      - `metadata.namespace` is the namespace of the companion
        [MeshGatewayInstance](policy:MeshGatewayInstance), matched on the shared
        `kuma.io/service` tag. `MeshGateway` is cluster-scoped, the gateway pods run in the
        instance's namespace, and Kuma creates a Gateway's instance in the Gateway's own
        namespace. Instances in several namespaces pick the first and warn; none omits the
        field and warns (apply with `-n`). An empty namespace is never emitted.
      - `spec.gatewayClassName` is the name of the GatewayClass generated from the same
        instance. An instance without `spec.tags["kuma.io/service"]` matches on the
        `<name>_<namespace>_svc` tag Kuma gives it. Several matches pick the first and warn;
        none leaves `REPLACE-WITH-YOUR-GATEWAYCLASS` and warns.
      - `spec.selectors` has no Gateway API equivalent and is reported.

      **Universal input** is copied unchanged, with an advisory that 3.0 removes the built-in
      gateway: Universal has no Gateway API, so a `Gateway` could not be applied
      (`kumactl apply`: `invalid resource type`).
  v3:
    status: converted
    output: [Gateway]
    notes: |
      **Universal input** is rejected by the target and written to `_manual/` unchanged, with
      the delegated-gateway steps for Universal: run your gateway on a `Dataplane` without
      `kuma.io/gateway` and start `kuma-dp` with `--exclude-inbound-ports` covering its listen
      ports. Kubernetes input:

      The listener block and `metadata.namespace` are converted as on v2, but
      `gatewayClassName` is always `REPLACE-WITH-YOUR-GATEWAYCLASS`: 3.0 has no Gateway or GatewayClass reconciler. Set it to
      the class of the gateway implementation you adopt, and rejoin the workload as a delegated
      gateway (`traffic.kuma.io/exclude-inbound-ports` on the pod, `kuma.io/ignore: "true"` on
      its Service).

      Delete the source `MeshGateway` before upgrading: the 3.0 chart deletes its CRD and every
      object stored under it.
  timeline:
    - version: "2.10"
      change: "Policies no longer attach to built-in gateway listeners through a top-level `targetRef.kind: MeshGateway`."
    - version: "3.0"
      change: Built-in gateway API removed (types, CRDs, KDS sync); `MeshGateway` is no longer a valid `targetRef.kind`.
  topics: [gateways]
  code: [pkg/migrator/gateway.go, pkg/migrator/gateway_universal.go]

- kind: MeshGatewayRoute
  group: gateway
  product: kuma
  summary: Built-in gateway HTTP or TCP routes attached to MeshGateway listeners.
  v2:
    status: converted
    output: [HTTPRoute, TCPRoute, ReferenceGrant]
    notes: |
      `conf.http` → Gateway API `HTTPRoute`, `conf.tcp` → `TCPRoute`.

      - `parentRefs[]` come from `spec.selectors[]`. The `kuma.io/service` tag is matched
        against the [MeshGateway](policy:MeshGateway) documents in the input, so the parentRef
        names the converted Gateway (named after the `MeshGateway`, not after the tag) in the
        namespace that Gateway gets. The remaining tags select listeners by their `tags`, and
        each match becomes a parentRef whose `sectionName` is that listener's emitted name.
        A tag selected by several `MeshGateway`s emits one parentRef per Gateway and warns.
        When no `MeshGateway` in the input selects the tag, the name is decoded from
        `<name>_<ns>_svc` (or the raw tag is used) and a warning asks you to verify it.
      - `MeshGatewayRoute` is cluster-scoped. When every parent Gateway resolves to one
        namespace, the route is placed there: a Gateway listener accepts routes only from its
        own namespace by default.
      - `backends[].destination["kuma.io/service"]` → `backendRefs[]` of `kind: Service` with
        the decoded name, namespace and port.
      - A backend in another namespace than the route gets a `ReferenceGrant`. A route whose
        namespace is still unknown is reported instead.

      A warning states the alternative successor: if Kuma should keep routing this traffic,
      write a `MeshHTTPRoute`/`MeshTCPRoute`. Kuma never reconciles `TCPRoute`; only the
      gateway implementation you adopt does.

      **Universal input** is copied unchanged with a 3.0 advisory: Universal has no Gateway
      API.
  v3:
    status: converted
    output: [HTTPRoute, TCPRoute, ReferenceGrant]
    notes: |
      **Universal input** is rejected by the target and written to `_manual/` unchanged, with
      the same delegated-gateway guidance as [MeshGateway](policy:MeshGateway). Kubernetes
      input:

      Same conversion. Generated routes carry `kuma.io/mesh` as a label and integer
      `backendRefs[].port`. 3.0 ignores HTTPRoutes whose parentRef is a `Gateway`, so only your
      gateway implementation reconciles them. Delete the source `MeshGatewayRoute` before
      upgrading.
  timeline:
    - version: "3.0"
      change: Built-in gateway API removed. Cross-namespace Gateway API `backendRefs` require a `ReferenceGrant`.
  topics: [gateways]
  code: [pkg/migrator/gatewayroute.go, pkg/migrator/gateway.go, pkg/migrator/gateway_universal.go]

- kind: MeshGatewayInstance
  group: gateway
  product: kuma
  summary: Deployment and Service settings for a built-in gateway on Kubernetes.
  v2:
    status: converted
    output: [GatewayClass, MeshGatewayConfig]
    notes: |
      Converted to a `GatewayClass` named after the instance
      (`controllerName: gateways.kuma.io/controller`) whose `parametersRef` points at a
      `MeshGatewayConfig` carrying the instance `spec` (`replicas`, `serviceType`, `tags`).
      Both are cluster-scoped, so neither the `MeshGatewayConfig` nor the `parametersRef`
      has a namespace: Kuma marks a class whose `parametersRef` names a namespace as
      `InvalidParameters` and ignores its Gateways.

      `tags["kuma.io/service"]` is dropped from the `MeshGatewayConfig`, with a warning: Kuma
      copies those tags onto the instance it creates for each Gateway, which must keep the
      generated `<gateway>_<namespace>_svc` value.

      Set `gatewayClassName` on your Gateways to this name and create them in the instance's
      namespace; the converted [MeshGateway](policy:MeshGateway) does both automatically
      when the `kuma.io/service` tags match.
  v3:
    status: error
    output: []
    notes: |
      Not converted: `GatewayClass` and `MeshGatewayConfig` do nothing on 3.0. The error
      describes the replacement, a delegated gateway (a Deployment and Service you own):
      exclude its listen ports from inbound redirection with
      `traffic.kuma.io/exclude-inbound-ports` (Universal: `kuma-dp --exclude-inbound-ports`)
      and annotate the Service `kuma.io/ignore: "true"`. It carries over the `replicas`,
      `serviceType` and `tags` the manifest holds. The original goes to `_manual/`.
  timeline:
    - version: "2.7"
      change: Setting `kuma.io/service` in `tags` deprecated (forbidden from 2.9).
    - version: "3.0"
      change: Removed with the built-in gateway API and its Kubernetes controllers.
  topics: [gateways]
  code: [pkg/migrator/gateway.go]

- kind: MeshGatewayConfig
  group: gateway
  product: kuma
  summary: Built-in gateway deployment parameters referenced from a GatewayClass.
  v2:
    status: passthrough
    output: [MeshGatewayConfig]
    notes: |
      Copied unchanged when found in the input. Also emitted, cluster-scoped and without a
      namespace, from a [MeshGatewayInstance](policy:MeshGatewayInstance) conversion.
  v3:
    status: removed
    output: []
    notes: |
      Copied to `_manual/` (file labelled `MANUAL`), never to the apply tree, with a warning:
      3.0 removes `MeshGatewayConfig` with the rest of the built-in gateway API, and the Helm
      upgrade deletes the `meshgatewayconfigs.kuma.io` CRD and every object stored under it.
      Carry its settings (replicas, service type, resources) over to the Deployment and Service
      of the gateway you run. Listed under "Delete Before Upgrading to 3.0" with a
      `kubectl delete` command (it is a cluster-scoped Kubernetes-only CRD, so never `kumactl`).
  timeline:
    - version: "3.0"
      change: Removed with the built-in gateway API (`meshgatewayconfigs.kuma.io` CRD deleted).
  topics: [gateways]
  code: [pkg/migrator/gateway.go, pkg/migrator/v3_kongmesh.go]

# ---------------------------------------------------------------------------
# Other resources
# ---------------------------------------------------------------------------

- kind: Mesh
  group: resource
  product: kuma
  summary: "Mesh-wide settings: mTLS backends, legacy observability backends, routing and networking defaults."
  v2:
    status: rewritten
    output: [Mesh, MeshMetric, MeshPassthrough]
    notes: |
      Rewritten when it has observability sections, sets `networking.outbound.passthrough`, or
      does not set `meshServices.mode: Exclusive`:

      - `spec.metrics` is removed. Its `enabledBackend` turns metrics on for every proxy, so
        that backend becomes a companion `MeshMetric` `<mesh>-metrics` with `targetRef: Mesh`.
        Backends that are not enabled are dropped; no `enabledBackend` means no `MeshMetric`.
      - `spec.tracing` and `spec.logging` are removed **without** a companion. On 2.x they only
        declare backends: a [TrafficTrace](policy:TrafficTrace) or [TrafficLog](policy:TrafficLog)
        activates one, and its conversion carries the backend inline. A mesh-wide
        `MeshTrace`/`MeshAccessLog` would turn tracing/logging on for every proxy. The warning
        lists which backends a `TrafficLog`/`TrafficTrace` in the input references and which
        none does (those were inactive, nothing is lost).
      - `networking.outbound.passthrough: false` becomes a `MeshPassthrough` `<mesh>-passthrough`
        with `passthroughMode: None`.
      - `spec.meshServices.mode: Exclusive` is injected: 3.0 requires it, and a 2.x zone reads
        a missing field as `Disabled`.
      - `networking.outbound.passthrough: true` is removed (it is the 2.x default) with a
        warning to add a `MeshPassthrough` with `passthroughMode: All` before 3.0.

      Kept, with advisories: `spec.mtls` (the move to `MeshIdentity` + `MeshTrust` is a CA
      cutover, not a rewrite; the advisory is specific to the backend type: `builtin` names the
      `ca-builtin-*` Secrets to reuse from a `Bundled` `MeshIdentity`, `provided` names its
      `conf.cert`/`conf.key` DataSources, and Kong Mesh `vault`/`acmpca`/`cert-manager` name
      their `Extension` provider), a `PERMISSIVE` mTLS backend,
      `routing.defaultForbidMeshExternalServiceAccess`, `routing.zoneEgress`,
      `routing.localityAwareLoadBalancing`, `skipCreatingInitialPolicies`, `constraints` (the
      data plane proxy membership rules, not enforced on 3.0). Names that are not RFC 1035
      labels are reported.
  v3:
    status: rewritten
    output: [Mesh, MeshMetric, MeshTLS, MeshPassthrough]
    notes: |
      v2 rewrites, plus:

      - `spec.mtls` is **removed** with a blocking warning: create a `MeshIdentity` (and
        `MeshTrust`) covering every proxy before upgrading, or the mesh serves plaintext and
        `MeshTLS`/`MeshTrafficPermission` stop applying.
      - A `PERMISSIVE` enabled backend generates a `MeshTLS` `<mesh>-tls-permissive` with
        `rules[].default.mode: Permissive`.
      - `outbound.passthrough: true` generates a `MeshPassthrough` `<mesh>-passthrough` with
        `passthroughMode: All`. When the field is unset, a warning explains that 3.0 defaults
        to `None`.
      - `routing.zoneEgress`, `routing.localityAwareLoadBalancing`,
        `routing.defaultForbidMeshExternalServiceAccess`, `skipCreatingInitialPolicies` and
        `constraints` are deleted. For `constraints` the warning lists the requirements and
        restrictions that stop being enforced (3.0 has no membership check) and the nearest
        control: dataplane tokens bound to the mesh and tags.
      - `meshServices.mode: Exclusive` is kept. A 3.0 control plane accepts it with the
        deprecation warning "meshServices was removed in 3.0 and is ignored"; that is expected.
        The field is needed while any zone runs 2.x (a 2.x zone reads a missing field as
        `Disabled` and deletes its generated `MeshService`s). Drop it once every zone runs
        3.0. See [Meshes](../topics/meshes.md#meshservices-on-30).

      Companion policies keep the format of the `Mesh`: Universal input gives Universal
      documents (`type`/`name`/`mesh`), Kubernetes input gives CRDs in the system namespace
      (see [Meshes](../topics/meshes.md#system-namespace)).
  timeline:
    - version: "2.10"
      change: Names that are not RFC 1035 labels deprecated.
    - version: "2.12"
      change: "`MeshIdentity` + `MeshTrust` introduced as the successor to `spec.mtls`."
    - version: "3.0"
      change: "`mtls`, `tracing`, `logging`, `routing.zoneEgress`, `routing.localityAwareLoadBalancing`, `routing.defaultForbidMeshExternalServiceAccess`, `networking.outbound.passthrough`, `constraints` and `skipCreatingInitialPolicies` removed. `meshServices` has no effect but must be `Exclusive`. Non-RFC 1035 names rejected."
  topics: [meshes, mtls-identity, observability, meshservice]
  code: [pkg/migrator/mesh.go, pkg/migrator/v3_mesh.go, pkg/migrator/deprecation.go]

- kind: Dataplane
  group: resource
  product: kuma
  summary: A data plane proxy's inbounds, outbounds, gateway role and transparent-proxy settings.
  v2:
    status: warned
    output: [Dataplane]
    notes: |
      Skipped on Kubernetes (CP-generated). On Universal it is scanned and copied unchanged;
      a Dataplane with a finding is labelled `SCANNED`, one without `SKIP`:

      - `transparentProxying.redirectPortInboundV6` is reported (removed in 2.9).
      - `transparentProxying.reachableServices` is reported: in `Exclusive` mode the names must
        be MeshService display names, and 3.0 removes the field.
      - `reachableBackends.refs[]` using `name`/`namespace` are reported (3.0 selects by labels).
  v3:
    status: rewritten
    output: [Dataplane]
    notes: |
      Universal only. The file is labelled `SCANNED` ("rewritten by the deprecation scan")
      on stdout and listed under **Scanned Non-Policy Resources** in the report. Rewrites:

      - `networking.gateway` (any type) removed; its non-reserved tags move to labels.
      - Inbound `kuma.io/protocol` tag → `inbound[].protocol`.
      - `inbound[].tags` → top-level `labels`; `kuma.io/` and `k8s.kuma.io/` keys are dropped
        (reserved prefixes).
      - `reachableServices` → `reachableBackends` where the name resolves;
        `reachableBackends` name refs → labels.
      - Control-plane-owned labels (e.g. `k8s.kuma.io/service-account`) removed.

      - `outbound[].tags` → `backendRef` (`kind: MeshService`, labels, port) when the
        `kuma.io/service` value is `<name>_<ns>_svc_<port>`. Otherwise the MeshService port is
        not in the manifest: 3.0 rejects the Dataplane (`networking.outbound[0].backendRef:
        must be defined`), so it is written to `_manual/` with the `backendRef` to fill in.

      Reported, not rewritten: `advertisedAddress`, `redirectPortInbound`/`redirectPortOutbound`
      (removed in 3.1), `ipFamilyMode`, and transparent proxying without `reachableBackends`
      (no outbounds on 3.0).
  timeline:
    - version: "2.9"
      change: "`transparentProxying.redirectPortInboundV6` removed."
    - version: "3.0"
      change: "`inbound[].tags`, `outbound[].tags`, `advertisedAddress`, `networking.gateway`, `reachableServices` and `ipFamilyMode` removed; the protocol is no longer read from `kuma.io/protocol`; proxies without `reachableBackends` get no outbounds."
  topics: [dataplanes, meshservice]
  code: [pkg/migrator/v3_dataplane.go, pkg/migrator/deprecation.go, pkg/config/config.go]

- kind: MeshService
  group: resource
  product: kuma
  summary: A service in the mesh, selecting its proxies and declaring its ports and identities.
  v2:
    status: rewritten
    output: [MeshService]
    notes: |
      - `spec.ports[].protocol` → `appProtocol` (auto-fixed).
      - `spec.selector.dataplaneTags` is reported: a 3.0 control plane rejects the
        MeshService on write (`spec.selector.dataplaneTags: unknown field`), and one already
        stored loses its selector and matches no proxies. Not rewritten on v2: on 2.14 a labels selector also matches
        same-named services synced from other zones.
      - Names that are not RFC 1035 labels are reported.
  v3:
    status: rewritten
    output: [MeshService]
    notes: |
      - `ports[].protocol` → `appProtocol`.
      - `selector.dataplaneTags` → `selector.dataplaneLabels.matchLabels`. The keys must exist
        as labels on the Dataplanes (Pod labels on Kubernetes, top-level labels on Universal).
        A selector with a reserved `kuma.io/` key (such as `kuma.io/service`) or one that
        conflicts with existing `matchLabels` is not converted; 3.0 rejects it as an unknown
        field, so the MeshService is written to `_manual/`.
      - `identities[]` entries of `type: ServiceTag` removed; add `type: SpiffeID` entries if
        clients need them.
      - Control-plane-owned labels removed.
  timeline:
    - version: "2.8"
      change: "`ports[].protocol` renamed to `appProtocol`."
    - version: "2.10"
      change: Names that are not RFC 1035 labels deprecated.
    - version: "3.0"
      change: "`dataplaneTags` removed; `identities` accepts SPIFFE IDs only; non-RFC 1035 names rejected."
  topics: [meshservice]
  code: [pkg/migrator/v3_scan.go, pkg/migrator/deprecation.go]

- kind: MeshExternalService
  group: resource
  product: kuma
  summary: An external destination reachable from the mesh through zone egress.
  v2:
    status: warned
    output: [MeshExternalService]
    notes: |
      Copied unchanged. `spec.tls.verification.{caCert,clientCert,clientKey}` in the flat
      DataSource shape (`inline`, `inlineString`, `secret`) are reported: 3.0 requires
      `SecureDataSource`, and 2.14.6+ accepts both. Names that are not RFC 1035 labels are
      reported.
  v3:
    status: rewritten
    output: [MeshExternalService]
    notes: |
      - `inlineString` → `type: InsecureInline` + `insecureInline.value`; `secret` →
        `type: Secret` + `secretRef`. Apply while every control plane runs 2.14.6 or later.
      - `inline` (base64) is not converted: that means decoding credential material into
        plain text, which is your decision. 3.0 rejects the field
        (`spec.tls.verification.caCert.inline: unknown field`), so the MeshExternalService is
        written to `_manual/`; rewrite it as `type: Secret` + `secretRef` (or
        `InsecureInline`) and apply it from there.
      - A `kuma.io/zone` label is reported: 3.0 removes per-zone routing and every zone's egress
        dials the endpoint directly.
      - A mesh with no `MeshIdentity` in the input set is reported: 3.0 builds the cluster only
        for clients with a workload identity, else `503 cluster_not_found`.
  timeline:
    - version: "2.9"
      change: Unix socket endpoints removed.
    - version: "2.14.6"
      change: TLS verification accepts the `SecureDataSource` shape.
    - version: "3.0"
      change: "`SecureDataSource` required; per-zone routing removed; clusters require a `MeshIdentity`; non-RFC 1035 names rejected."
  topics: [external-services, mtls-identity]
  code: [pkg/migrator/v3_mes.go, pkg/migrator/deprecation.go, pkg/migrator/externalservice.go]

- kind: MeshMultiZoneService
  group: resource
  product: kuma
  summary: A service that groups same-named MeshServices across zones.
  v2:
    status: warned
    output: [MeshMultiZoneService]
    notes: |
      Copied unchanged. A name that is not a lowercase RFC 1035 label, or longer than 63
      characters, is reported.
  v3:
    status: warned
    output: [MeshMultiZoneService]
    notes: |
      Same name check (a hard error on 3.0). Control-plane-owned labels removed.
  timeline:
    - version: "2.10"
      change: Names that are not RFC 1035 labels deprecated.
    - version: "2.14"
      change: Names longer than 63 characters deprecated.
    - version: "3.0"
      change: Non-RFC 1035 names rejected. Cross-zone routing needs a `MeshZoneAddress`.
  topics: [multizone, meshservice]
  code: [pkg/migrator/validate.go, pkg/migrator/deprecation.go]

- kind: MeshOpenTelemetryBackend
  group: resource
  product: kuma
  summary: A shared OpenTelemetry collector endpoint referenced by MeshMetric, MeshTrace and MeshAccessLog.
  v2:
    status: passthrough
    output: [MeshOpenTelemetryBackend]
    notes: |
      Copied unchanged. Not generated under v2: the resource does not exist before 2.14.
  v3:
    status: passthrough
    output: [MeshOpenTelemetryBackend]
    notes: |
      Copied unchanged. Also generated, one per inline `openTelemetry.endpoint` found in a
