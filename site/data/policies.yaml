      change: Introduced.
    - version: "3.0"
      change: Backends referenced by `backendRef` always export through `kuma-dp`.
  topics: [observability]
  code: [pkg/migrator/v3_mesh.go]

- kind: HostnameGenerator
  group: resource
  product: kuma
  summary: Template that publishes DNS hostnames for MeshService, MeshExternalService and MeshMultiZoneService.
