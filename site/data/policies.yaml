# Per-resource reference data for the /docs/policies/ section.
# Schema, status vocabulary and writing style: site/README.md.
# Every v2/v3 block describes what `kuma-migrator migrate --to-latest v2|v3` does today.

# ---------------------------------------------------------------------------
# Legacy Kuma policies
# ---------------------------------------------------------------------------

- kind: Timeout
  group: legacy
  product: kuma
  summary: Legacy connection and request timeouts between services, selected with sources and destinations.
  v2:
    status: converted
    output: [MeshTimeout]
    notes: |
      Outbound shape: `sources` becomes `spec.targetRef`, `destinations` becomes `to[]`.
      A policy with several specific sources is split into one `MeshTimeout` per source.

      `conf` is rewritten field by field:

      | Legacy `conf` | `MeshTimeout` `to[].default` |
      |---|---|
      | `connectTimeout` | `connectionTimeout` |
      | `tcp.idleTimeout`, `http.idleTimeout` | `idleTimeout` (tcp wins on conflict, with a warning) |
      | `http.requestTimeout`, `http.streamIdleTimeout`, `http.maxStreamDuration` | same path |
      | `grpc.streamIdleTimeout`, `grpc.maxStreamDuration` | `http.*` (no `grpc` section exists) |

      Any `conf` leaf no rule consumed is reported as a warning. A `kuma.io/service: '*'`
      selector becomes `kind: Mesh`. A specific service becomes
      `kind: Dataplane, labels: {app: <name>, k8s.kuma.io/namespace: <ns>}` at the top level
      (`app` is a best guess, warned) and `kind: MeshService` in `to[]`;
      `<name>_<ns>_svc_<port>` values are decoded into name and namespace. Reserved tags that
      are not labels (`kuma.io/protocol`, …) are dropped from label selectors, with a warning.
      A selector with only non-service tags stays a `MeshSubset`.
  v3:
    status: converted
    output: [MeshTimeout]
    notes: |
      Same `conf` conversion as v2. Every generated reference uses labels: the top-level
      `Dataplane` gets `labels: {app: <service>}` (a best guess, reported as a warning) and a
      `to[]` `MeshService` gets `kuma.io/display-name` plus `k8s.kuma.io/namespace`.

      A destination selector with no `kuma.io/service` tag is an **error**: 3.0 accepts no tag
      selector in `to[]`. The original is copied to `_manual/` and you pick the real
      destination by hand. The report lists the source `Timeout` under
      "Delete Before Upgrading to 3.0".
  timeline:
    - version: "3.0"
      change: No longer affects generated Envoy configuration.
    - version: "3.0"
      change: Removed from the resource registry with the other 11 legacy policies. Stored objects are not migrated.
  topics: [legacy-policies, policy-targeting]
  code: [pkg/migrator/transform.go, pkg/migrator/legacyconf.go, pkg/migrator/convert.go]

- kind: CircuitBreaker
  group: legacy
  product: kuma
  summary: Legacy outlier detection and connection limits for a destination service.
  v2:
    status: converted
    output: [MeshCircuitBreaker]
    notes: |
      Outbound shape (`sources` → `spec.targetRef`, `destinations` → `to[]`). The flat legacy
      `conf` is split in two:

      | Legacy `conf` | `MeshCircuitBreaker` `to[].default` |
      |---|---|
      | `thresholds.{maxConnections,maxPendingRequests,maxRequests,maxRetries}` | `connectionLimits.*` |
      | `interval`, `baseEjectionTime`, `maxEjectionPercent`, `splitExternalAndLocalErrors` | `outlierDetection.*` |
      | `detectors.totalErrors` | `outlierDetection.detectors.totalFailures` |
      | `detectors.gatewayErrors` | `outlierDetection.detectors.gatewayFailures` |
      | `detectors.localErrors` | `outlierDetection.detectors.localOriginFailures` |
      | `detectors.standardDeviation.{requestVolume,minimumHosts,factor}` | `outlierDetection.detectors.successRate.{requestVolume,minimumHosts,standardDeviationFactor}` |
      | `detectors.failure.*` | `outlierDetection.detectors.failurePercentage.*` |

      Unmapped leaves are reported. Targeting rules are the same as for [Timeout](policy:Timeout).
  v3:
    status: converted
    output: [MeshCircuitBreaker]
    notes: |
      Same conversion, with labels-only references (see [Timeout](policy:Timeout)). A
      destination with no `kuma.io/service` tag is an error and the original goes to `_manual/`.
      The source object is listed under "Delete Before Upgrading to 3.0".
  timeline:
    - version: "3.0"
      change: Removed from the resource registry. Stored objects are not migrated.
  topics: [legacy-policies, policy-targeting]
  code: [pkg/migrator/transform.go, pkg/migrator/legacyconf.go, pkg/migrator/convert.go]

- kind: Retry
  group: legacy
  product: kuma
  summary: Legacy HTTP, gRPC and TCP retry settings for a destination service.
  v2:
    status: converted
    output: [MeshRetry]
    notes: |
      Outbound shape. `conf` changes:

      - `tcp.maxConnectAttempts` → `tcp.maxConnectAttempt` (singular).
      - `http.retryOn` enum values are recased (`gateway_error` → `GatewayError`, `5xx` stays).
      - `http.retriableMethods` → extra `http.retryOn` entries (`GET` → `HttpMethodGet`).
      - gRPC `retryOn` `cancelled` → `Canceled`.
      - `numRetries`, `perTryTimeout`, `backOff.*` keep their paths.

      `http.retriableStatusCodes` has no `MeshRetry` equivalent. It is dropped with a warning;
      use `retryOn` values such as `5xx` or `GatewayError` instead.
  v3:
    status: converted
    output: [MeshRetry]
    notes: |
      Same conversion with labels-only references. A destination with no `kuma.io/service`
      tag is an error (original in `_manual/`). The source object is listed for deletion.
  timeline:
    - version: "3.0"
      change: Removed from the resource registry. Meshes created on 3.0 also no longer get the default `mesh-retry-all-<mesh>` policy.
  topics: [legacy-policies, policy-targeting]
  code: [pkg/migrator/transform.go, pkg/migrator/legacyconf.go]

- kind: HealthCheck
  group: legacy
  product: kuma
  summary: Legacy active health checking of destination endpoints.
  v2:
    status: converted
    output: [MeshHealthCheck]
    notes: |
      Outbound shape. `interval`, `timeout`, `unhealthyThreshold`, `healthyThreshold`,
      `tcp.*`, `http.path` and `http.expectedStatuses` keep their paths.
      `http.requestHeadersToAdd` is split into `{add, set}` (`append` unset means `add`). Header
      names are lower-cased, with a warning: the `MeshHealthCheck` schema accepts lower-case
      names only (`Accept` is rejected) and HTTP header names are case-insensitive.

      `healthyPanicThreshold` is copied to `to[].default.healthyPanicThreshold` and the scanner
      warns that it is deprecated since 2.10 and removed in 3.0: move it to a
      `MeshCircuitBreaker` `outlierDetection.healthyPanicThreshold`.
  v3:
    status: converted
    output: [MeshHealthCheck, MeshCircuitBreaker]
    notes: |
      `healthyPanicThreshold` is removed from the `MeshHealthCheck` and moved to a companion
      `MeshCircuitBreaker` named `<name>-panic-threshold`, written as its own file. 3.0 reads
      the threshold only when outlier detection is enabled, so the companion also sets
      `detectors.totalFailures.consecutive: 5`. That enables outlier ejection for those
      destinations; if a `MeshCircuitBreaker` already covers them, move the threshold into it
      and drop the companion.

      References are labels-only. A destination with no `kuma.io/service` tag is an error.
  timeline:
    - version: "2.10"
      change: "`healthyPanicThreshold` on `MeshHealthCheck` deprecated in favour of `MeshCircuitBreaker`."
    - version: "3.0"
      change: Removed from the resource registry.
  topics: [legacy-policies, policy-targeting]
  code: [pkg/migrator/legacyconf.go, pkg/migrator/v3_policy.go]

- kind: TrafficLog
  group: legacy
  product: kuma
  summary: Legacy access logging that references a logging backend declared on the Mesh.
  v2:
    status: converted
    output: [MeshAccessLog]
    notes: |
      Outbound shape. `conf.backend` is a **name** that points into
      `Mesh.spec.logging.backends`, while `MeshAccessLog` declares the backend inline. The
      migrator indexes every `Mesh` in the input directory first and copies the matching
      backend into `to[].default.backends[]` (`file` → `type: File`, `tcp` → `type: Tcp`).

      If the Mesh is not in the input set, or the name is not found, the policy is emitted
      without the backend and a warning names the backend you must write by hand. With no
      `conf.backend`, the Mesh `defaultBackend` is used.

      The `TrafficLog` is what turns access logging on. The `Mesh` conversion does not
      generate a mesh-wide `MeshAccessLog` from `spec.logging`; this conversion is the only
      place a logging backend ends up in the output. See [Meshes](../topics/meshes.md#logging-and-tracing).
  v3:
    status: converted
    output: [MeshAccessLog]
    notes: |
      Same as v2. The source object is listed under "Delete Before Upgrading to 3.0".
  timeline:
    - version: "3.0"
      change: No longer affects generated Envoy configuration.
    - version: "3.0"
      change: Removed from the resource registry. `Mesh.spec.logging` is removed too.
  topics: [legacy-policies, observability]
  code: [pkg/migrator/legacybackend.go, pkg/migrator/transform.go]

- kind: TrafficTrace
  group: legacy
  product: kuma
  summary: Legacy tracing that references a tracing backend declared on the Mesh.
  v2:
    status: converted
    output: [MeshTrace]
    notes: |
      Selector shape: `selectors` → `spec.targetRef`, `conf` → `spec.default` (`MeshTrace` has
      no `to[]`). `conf.backend` is resolved against `Mesh.spec.tracing.backends` in the input
      set and written inline: `zipkin`/`datadog` backends become `spec.default.backends[]`,
      `sampling` becomes `sampling.overall`. An unresolved backend is reported by name.

      The `TrafficTrace` is what turns tracing on. The `Mesh` conversion does not generate a
      mesh-wide `MeshTrace` from `spec.tracing`; this conversion is the only place a tracing
      backend ends up in the output. See [Meshes](../topics/meshes.md#logging-and-tracing).
  v3:
    status: converted
    output: [MeshTrace]
    notes: |
      Same as v2. The source object is listed for deletion.
  timeline:
    - version: "3.0"
      change: No longer affects generated Envoy configuration.
    - version: "3.0"
      change: Removed from the resource registry. `Mesh.spec.tracing` is removed too.
  topics: [legacy-policies, observability]
  code: [pkg/migrator/legacybackend.go, pkg/migrator/transform.go]

- kind: TrafficPermission
  group: legacy
  product: kuma
  summary: Legacy allow rules between services under mTLS.
  v2:
    status: converted
    output: [MeshTrafficPermission]
    notes: |
      Inbound shape: `destinations` → `spec.targetRef`, `sources` → `from[]` with
      `default.action: Allow`. A specific source becomes
      `from[].targetRef: {kind: MeshSubset, tags: <the source's tags>}`, the form 2.7+ documents
      in place of the deprecated `kind: MeshService`; a `kuma.io/service: '*'` source becomes
      `kind: Mesh`. The destination becomes `kind: Dataplane` with
      `labels: {app: <name>, k8s.kuma.io/namespace: <ns>}` (`app` is a best guess, warned).
      Every `from[]` is reported as deprecated in favour of the `rules[]` API (removed in 3.0).
  v3:
    status: error
    output: []
    notes: |
      Not converted. 3.0 removes `MeshTrafficPermission` `spec.from`, and its replacement
      `rules[].default.{allow,deny,allowWithShadowDeny}[]` matches clients by SPIFFE ID. That
      needs a `MeshIdentity` and its trust domain, which the manifest does not carry, and
      `rules[]` is default-deny. The original is copied to `_manual/`; write an allow entry for
      every client it let in. Re-run with `--to-latest v2` to get the `from[]` form.
  timeline:
    - version: "2.6"
      change: New meshes no longer get default `TrafficPermission`/`TrafficRoute` resources.
    - version: "3.0"
      change: No longer affects generated Envoy configuration; inbounds that relied only on it default to deny.
    - version: "3.0"
      change: Removed from the resource registry.
  topics: [legacy-policies, access-control, mtls-identity]
  code: [pkg/migrator/transform.go, pkg/migrator/convert.go]

- kind: FaultInjection
  group: legacy
  product: kuma
  summary: Legacy HTTP delays, aborts and bandwidth limits injected on a destination's inbound.
  v2:
    status: converted
    output: [MeshFaultInjection]
    notes: |
      Inbound shape: `destinations` → `spec.targetRef` (`Dataplane` labels), `sources` →
      `from[]` as `kind: MeshSubset` with the source's tags (`kind: Mesh` for
      `kuma.io/service: '*'`), not the 2.7-deprecated `MeshService`. Reserved tags such as
      `kuma.io/protocol` are dropped from the `Dataplane` labels, with a warning. The single
      legacy `conf` becomes a one-element `default.http[]` list (`delay`, `abort`,
      `responseBandwidth`). Percentages are numbers when whole and strings when fractional.
      `responseBandwidth.limit` is rewritten with the units `MeshFaultInjection` accepts
      (`50 mbps` → `50Mbps`, `kbps`, `Gbps`), with a warning; a value that is not
      `<integer><unit>` is copied and warned, because the control plane rejects it.
      The scanner then warns that `from[]` is deprecated in favour of `rules[]`.
  v3:
    status: converted
    output: [MeshFaultInjection]
    notes: |
      Converted to `rules[]` (no `matches[]`) only when every source is
      `kuma.io/service: '*'`, which keeps the "all clients" scope. Any specific source is an
      **error**: `rules[].matches[]` selects clients by SPIFFE ID or SNI, which the manifest
      does not carry. The original goes to `_manual/`.
  timeline:
    - version: "2.10"
      change: No longer generates Envoy configuration.
    - version: "3.0"
      change: Removed from the resource registry.
  topics: [legacy-policies, policy-targeting]
  code: [pkg/migrator/transform.go, pkg/migrator/legacyconf.go]

- kind: RateLimit
  group: legacy
  product: kuma
  summary: Legacy local HTTP rate limit enforced on a destination's inbound.
  v2:
    status: converted
    output: [MeshRateLimit]
    notes: |
      Inbound policy: `destinations` → `spec.targetRef`, conf → `rules[].default`.
      `http.requests` + `http.interval` → `local.http.requestRate.{num,interval}`;
      `http.onRateLimit.*` → `local.http.onRateLimit.*`. Header names are lower-cased, with a
      warning (the new schema accepts lower-case names only).

      The output uses `rules[]`, not `from[]`. A specific `sources` selector cannot be kept:
      the limit then applies to every client of the inbound, and a warning says so.
  v3:
    status: converted
    output: [MeshRateLimit]
    notes: |
      Same as v2, with labels-only top-level references. The source object is listed for
      deletion.
  timeline:
    - version: "3.0"
      change: Removed from the resource registry.
  topics: [legacy-policies, policy-targeting]
  code: [pkg/migrator/transform.go, pkg/migrator/legacyconf.go]

- kind: ProxyTemplate
  group: legacy
  product: kuma
  summary: Legacy raw Envoy resource and modification injection for selected proxies.
  v2:
    status: converted
    output: [MeshProxyPatch]
    notes: |
      Selector shape: `selectors` → `spec.targetRef`. `conf.modifications` →
      `spec.default.appendModifications`, with every operation recased to the
      `MeshProxyPatch` enum: `add`, `remove`, `patch`, `addFirst`, `addLast`, `addBefore`,
      `addAfter` → `Add`, `Remove`, `Patch`, `AddFirst`, `AddLast`, `AddBefore`, `AddAfter`.
      `httpFilter` and `networkFilter` have no plain `Add`, so `add` there becomes `AddLast`
      with a warning; `cluster`, `listener` and `virtualHost` keep `Add`. A positional
      operation on a kind that does not accept it is warned.

      `conf.imports` and `conf.resources` have no `MeshProxyPatch` equivalent and are
      reported, not converted.
  v3:
    status: converted
    output: [MeshProxyPatch]
    notes: |
      Same as v2, with labels-only top-level references (`kind: Dataplane`,
      `labels: {app: <service>}`). The source object is listed for deletion.
  timeline:
    - version: "3.0"
      change: No longer affects generated Envoy configuration; profile imports are removed.
    - version: "3.0"
      change: Removed from the resource registry.
  topics: [legacy-policies]
  code: [pkg/migrator/legacyconf.go, pkg/migrator/transform.go]

- kind: TrafficRoute
  group: legacy
  product: kuma
  summary: Legacy L4/L7 traffic splitting and routing between services.
  v2:
    status: error
    output: []
    notes: |
      Not converted. A `TrafficRoute` maps to either `MeshHTTPRoute` or `MeshTCPRoute`
      depending on the protocol, which the manifest does not state. The original is copied
      unchanged into the output tree and reported under "Errors".
  v3:
    status: error
    output: []
    notes: |
      Not converted. The original is copied to `_manual/` and listed under
      "Delete Before Upgrading to 3.0". Write the replacement
      [MeshHTTPRoute](policy:MeshHTTPRoute) or [MeshTCPRoute](policy:MeshTCPRoute) by hand.
  timeline:
    - version: "2.6"
      change: New meshes no longer get a default `TrafficRoute`.
    - version: "3.0"
      change: No longer affects generated Envoy configuration.
    - version: "3.0"
      change: Removed from the resource registry.
  topics: [legacy-policies]
  code: [pkg/migrator/transform.go, pkg/migrator/convert.go]

- kind: VirtualOutbound
  group: legacy
  product: kuma
  summary: Legacy virtual hostnames and ports rendered from Dataplane tags.
  v2:
    status: error
    output: []
    notes: |
      Not converted. `conf.host` and `conf.port` are templates over arbitrary Dataplane tags
      (`parameters[].tagKey`), and no single successor reproduces them:

      | | `VirtualOutbound` | `HostnameGenerator` |
      |---|---|---|
      | selects | Dataplanes by tags | `MeshService`/`MeshExternalService`/`MeshMultiZoneService` by labels |
      | template variables | any Dataplane tag | `.Name`, `.DisplayName`, `.Namespace`, `.Mesh`, `.Zone`, `label` |
      | port | templatable | not templatable |

      The error names both halves: a [HostnameGenerator](policy:HostnameGenerator) for the
      hostname and a `MeshHTTPRoute`/`MeshTCPRoute` for the routing. The original stays in the
      output tree.
  v3:
    status: error
    output: []
    notes: |
      Same error. The original is copied to `_manual/` and listed for deletion.
  timeline:
    - version: "3.0"
      change: No longer affects generated Envoy configuration; the legacy DNS VIP allocator is removed.
    - version: "3.0"
      change: Removed from the resource registry.
  topics: [legacy-policies]
  code: [pkg/migrator/transform.go]

- kind: ExternalService
  group: legacy
  product: kuma
  summary: Legacy external destination reached through the mesh, identified by a kuma.io/service tag.
  v2:
    status: converted
    output: [MeshExternalService]
    notes: |
      Kubernetes and Universal layouts are both read.

      | `ExternalService` | `MeshExternalService` |
      |---|---|
      | `networking.address` (`host:port`) | `spec.endpoints[]` and `spec.match.port` |
      | `tags["kuma.io/protocol"]` | `spec.match.protocol` (`tcp` if absent) |
      | `networking.tls.enabled`, `allowRenegotiation` | `spec.tls.*` |
      | `networking.tls.serverName` | `spec.tls.verification.serverName` |
      | `networking.tls.{caCert,clientCert,clientKey}` | `spec.tls.verification.*`, same DataSource shape |

      The output keeps the input format: a Universal `ExternalService` becomes a Universal
      `MeshExternalService` (`type`/`name`/`mesh`), a Kubernetes one becomes a CRD in the
      system namespace (see [Meshes](../topics/meshes.md#system-namespace)).

      `spec.match.type` is `HostnameGenerator`. Warnings remind you to check the virtual port,
      the generated hostname and `verification.mode` (defaults to `Secured`). The copied TLS
      DataSources then get the [MeshExternalService](policy:MeshExternalService) 3.0
      advisory.
  v3:
    status: converted
    output: [MeshExternalService]
    notes: |
      Same conversion. The output then goes through the `MeshExternalService` v3 scan:
      `inlineString` and `secret` DataSources are rewritten to `SecureDataSource`, `inline`
      stays warn-only, and a warning fires when the input set has no `MeshIdentity` for the
      mesh. The source object is listed under "Delete Before Upgrading to 3.0".
  timeline:
    - version: "3.0"
      change: Removed (CRD, API and webhook). Applying one after the upgrade fails.
  topics: [external-services, legacy-policies]
  code: [pkg/migrator/externalservice.go, pkg/migrator/v3_mes.go]

# ---------------------------------------------------------------------------
# Mesh* policies
# ---------------------------------------------------------------------------

- kind: MeshTrafficPermission
  group: mesh
  product: kuma
  summary: Allows or denies inbound traffic to selected proxies, by client selector (from[]) or SPIFFE identity (rules[]).
  v2:
    status: warned
    output: [MeshTrafficPermission]
    notes: |
      Passed through, with these checks:

      - `spiffeId` is renamed to `spiffeID` (auto-fixed).
      - `action: ALLOW`/`DENY` is reported; use `Allow`/`Deny`.
      - `from[].targetRef.kind: MeshService` is reported as deprecated since 2.7.
      - `from[]` is reported as deprecated in favour of `rules[]` and is **not** converted:
        `rules[]` matches clients by SPIFFE ID, needs a `MeshIdentity` and is default-deny, so
        a mechanical rewrite would fail or widen access.
      - A top-level `MeshSubset`, `MeshService` or `MeshServiceSubset` is reported; use
        `Dataplane` with labels.

      A policy whose refs still use `MeshSubset` with `kuma.io/service` tags, or old
      `<name>_<ns>_svc_<port>` names, is rewritten first (Subset scenario): the top level
      becomes `Dataplane` with labels. `from[]` keeps `MeshSubset` with the `kuma.io/service`
      tag (the 2.7+ form); a `from[]` `MeshService` with an old `_svc_` name is turned back
      into that `MeshSubset`.
  v3:
    status: error
    output: [MeshTrafficPermission]
    notes: |
      The v2 checks apply. A policy that keeps `from[]` is rejected by 3.0 as it stands
      (`spec.from: unknown field`, then "policy must define rules"), so it is written to
      `_manual/` instead of the apply tree and listed under **Action Items → Errors** with the
      reason. Translate `from[]` to `rules[]`, then apply it.

      Also under v3:

      - Empty match entries (`{}`) in `rules[].default.{allow,deny,allowWithShadowDeny}` are
        reported; 3.0 rejects them.
      - A top-level `MeshService` ref is rewritten from `name`/`namespace` to labels, but the
        kind stays and 3.0 accepts only `Mesh` and `Dataplane` there, so the policy is
        reported as an error and written to `_manual/`.
      - Control-plane-owned labels are removed.
  timeline:
    - version: "2.7"
      change: "`from[].targetRef.kind: MeshService` deprecated; use `MeshSubset` with the `kuma.io/service` tag."
    - version: "2.14"
      change: "`from[]` deprecated in favour of the SPIFFE-based `rules[]` API."
    - version: "3.0"
      change: "`spec.from` removed. Empty match entries rejected. Top-level `targetRef` limited to `Mesh` and `Dataplane`."
  topics: [access-control, mtls-identity, policy-targeting]
  code: [pkg/migrator/deprecation.go, pkg/migrator/v3_policy.go, pkg/migrator/rejected.go]

- kind: MeshTimeout
  group: mesh
  product: kuma
  summary: Connection, idle and request timeouts on inbound (rules[]) and outbound (to[]) traffic.
  v2:
    status: rewritten
    output: [MeshTimeout]
    notes: |
      - `from[]` → `rules[]`: each `from[i].default` becomes `rules[i].default` and the source
        `targetRef` is dropped (rules apply to every client).
      - When `from[]` and `to[]` coexist, the policy is split: `<name>` carries `rules[]` and
        `<name>-outbound` carries `to[]`. The validator rejects `rules[]` and `to[]` in one spec.
      - `MeshSubset` refs with `kuma.io/service` tags and old `<name>_<ns>_svc_<port>`
        `MeshService` names are rewritten: top level to `Dataplane`, `to[]` to `MeshService`
        (labels when the policy and target namespaces differ).
  v3:
    status: rewritten
    output: [MeshTimeout]
    notes: |
      Same rewrites as v2, plus the rules every Mesh* policy gets under v3:

      - `name`/`namespace`/`mesh` on `MeshService`, `MeshExternalService`,
        `MeshMultiZoneService` and `MeshHTTPRoute` refs become labels
        (`kuma.io/display-name`, `k8s.kuma.io/namespace`, plus the policy's `kuma.io/zone`).
      - `to[].targetRef.kind` must be `Mesh`, `MeshService`, `MeshExternalService`,
        `MeshMultiZoneService` or `MeshHTTPRoute`; anything else is reported.
      - Control-plane-owned labels (`kuma.io/origin`, `kuma.io/zone`, `kuma.io/policy-role`, …)
        are removed.
  timeline:
    - version: "2.10"
      change: "`rules[]` API added; `from[]` deprecated. `Dataplane` added as a top-level kind; `MeshSubset` deprecated."
    - version: "3.0"
      change: "`from` removed. Real resources selected by labels only. Top-level `targetRef` limited to `Mesh` and `Dataplane`."
  topics: [policy-targeting]
  code: [pkg/migrator/rulesapi.go, pkg/migrator/convert.go, pkg/migrator/v3_policy.go]

- kind: MeshCircuitBreaker
  group: mesh
  product: kuma
  summary: Connection limits and outlier detection on inbound (rules[]) and outbound (to[]) traffic.
  v2:
    status: rewritten
    output: [MeshCircuitBreaker]
    notes: |
      Same rewrites as [MeshTimeout](policy:MeshTimeout): `from[]` → `rules[]`, a
      `<name>-outbound` split when `to[]` is also present, and Subset-scenario ref rewrites.
  v3:
    status: rewritten
    output: [MeshCircuitBreaker]
    notes: |
      v2 rewrites plus labels-only refs and control-plane label removal. Allowed
      `to[].targetRef.kind`: `Mesh`, `MeshService`, `MeshExternalService`,
      `MeshMultiZoneService`. `MeshHTTPRoute` is rejected by 3.0 and reported.
  timeline:
    - version: "2.10"
      change: "`rules[]` API added; `from[]` deprecated."
    - version: "3.0"
      change: "`from` removed. `to[]` no longer accepts `MeshHTTPRoute`."
  topics: [policy-targeting]
  code: [pkg/migrator/rulesapi.go, pkg/migrator/v3_policy.go]

- kind: MeshRetry
  group: mesh
  product: kuma
  summary: Retry settings for outbound HTTP, gRPC and TCP traffic.
  v2:
    status: passthrough
    output: [MeshRetry]
    notes: |
      Copied unchanged unless it has Subset-scenario refs (`MeshSubset` with service tags, old
      `_svc_` names), which are rewritten. A deprecated top-level kind is reported.
  v3:
    status: rewritten
    output: [MeshRetry]
    notes: |
      Labels-only refs and control-plane label removal. Allowed `to[].targetRef.kind`: `Mesh`,
      `MeshService`, `MeshExternalService`, `MeshMultiZoneService`, `MeshHTTPRoute`.
  timeline:
    - version: "3.0"
      change: Real resources selected by labels only. New meshes no longer get a default `MeshRetry`.
  topics: [policy-targeting]
  code: [pkg/migrator/v3_policy.go]

- kind: MeshHealthCheck
  group: mesh
  product: kuma
  summary: Active health checks against outbound destinations.
  v2:
    status: warned
    output: [MeshHealthCheck]
    notes: |
      Copied unchanged. `healthyPanicThreshold` is reported: deprecated since 2.10, removed in
      3.0. Set it on a `MeshCircuitBreaker` with the same `targetRef` and `to[].targetRef`, as
      `to[].default.outlierDetection.healthyPanicThreshold`.
  v3:
    status: rewritten
    output: [MeshHealthCheck, MeshCircuitBreaker]
    notes: |
      `to[].default.healthyPanicThreshold` is removed and moved to a companion
      `MeshCircuitBreaker` named `<name>-panic-threshold`, written as its own file in the
      input's format (Universal or Kubernetes) and namespace (the system namespace when the
      `MeshHealthCheck` has none). It keeps the same `spec.targetRef` and `to[].targetRef`,
      rewritten to labels like the `MeshHealthCheck`'s. Both 2.14 and 3.0 reject
      `outlierDetection` without a detector, so the companion sets
      `detectors.totalFailures.consecutive: 5`; that turns on outlier ejection for those
      destinations, and the warning says so. If a `MeshCircuitBreaker` already covers them,
      move the threshold into it and drop the companion. The same applies to a
      `MeshHealthCheck` converted from a legacy [HealthCheck](policy:HealthCheck).

      Labels-only refs and control-plane label removal also apply. Allowed
      `to[].targetRef.kind`: `Mesh`, `MeshService`, `MeshExternalService`,
      `MeshMultiZoneService`.
  timeline:
    - version: "2.10"
      change: "`healthyPanicThreshold` deprecated in favour of `MeshCircuitBreaker`."
    - version: "3.0"
      change: "`healthyPanicThreshold` removed and dropped silently; Envoy falls back to its 50% default."
  topics: [policy-targeting]
  code: [pkg/migrator/deprecation.go, pkg/migrator/v3_policy.go]

- kind: MeshFaultInjection
  group: mesh
  product: kuma
  summary: HTTP delays, aborts and bandwidth limits on a proxy's inbound traffic.
  v2:
    status: warned
    output: [MeshFaultInjection]
    notes: |
      Copied unchanged. `from[]` is reported as deprecated in favour of `rules[]` and is not
      converted: `rules[].matches[]` selects clients by SPIFFE ID or SNI. Omitting `matches[]`
      applies the fault to all clients. `from[].targetRef.kind: MeshService` is reported as
      deprecated since 2.7. A Subset-scenario policy keeps `from[]` `MeshSubset` with the
      `kuma.io/service` tag (the 2.7+ form) instead of rewriting it to `MeshService`.
  v3:
    status: rewritten
    output: [MeshFaultInjection]
    notes: |
      When every `from[]` entry targets `kind: Mesh`, `from[]` is rewritten to `rules[]`
      without `matches[]`, which keeps the "every client" scope. Any narrower entry blocks the
      rewrite: the policy is reported as an error and written to `_manual/`, not to the apply
      tree.

      `to[]` accepts only `kind: Mesh`, and only when `spec.targetRef` is `kind: Mesh`; other
      combinations are reported as an error and written to `_manual/`. Labels-only refs and
      control-plane label removal apply.
  timeline:
    - version: "2.7"
      change: "`from[].targetRef.kind: MeshService` deprecated; use `MeshSubset` with the `kuma.io/service` tag."
    - version: "2.13"
      change: "`rules[]` API added."
    - version: "2.14"
      change: "`from[]` deprecated."
    - version: "3.0"
      change: "`from` removed. `to[]` accepts `kind: Mesh` only."
  topics: [policy-targeting]
  code: [pkg/migrator/deprecation.go, pkg/migrator/v3_policy.go, pkg/migrator/rejected.go]

- kind: MeshRateLimit
  group: mesh
  product: kuma
  summary: Local HTTP and TCP rate limits on a proxy's inbound traffic.
  v2:
    status: rewritten
    output: [MeshRateLimit]
    notes: |
      `from[]` → `rules[]` (see [MeshTimeout](policy:MeshTimeout)). The source `targetRef` in
      `from[]` is dropped, and a warning says the limit now applies to every client of the
      selected inbound.
  v3:
    status: rewritten
    output: [MeshRateLimit]
    notes: |
      Same rewrite. `to[]` accepts only `kind: Mesh` and only with a top-level `kind: Mesh`;
      other combinations are reported. Labels-only refs and control-plane label removal apply.
  timeline:
    - version: "2.10"
      change: "`rules[]` API added; `from[]` deprecated."
    - version: "3.0"
      change: "`from` removed. `to[]` accepts `kind: Mesh` only."
  topics: [policy-targeting]
  code: [pkg/migrator/rulesapi.go, pkg/migrator/v3_policy.go]

- kind: MeshAccessLog
  group: mesh
  product: kuma
  summary: Access logging for inbound and outbound traffic to file, TCP or OpenTelemetry backends.
  v2:
    status: rewritten
    output: [MeshAccessLog]
    notes: |
      - `from[]` → `rules[]`, with a `<name>-outbound` split when `to[]` is also present.
      - An inline `openTelemetry.endpoint` is reported: deprecated in 2.14, removed in 3.0.
        Define a [MeshOpenTelemetryBackend](policy:MeshOpenTelemetryBackend) and reference
        it with `backendRef` (labels only, system namespace). The warning says not to switch
        while any control plane or data plane runs below 2.14.
      - `openTelemetry.attributes[].key` values that 2.14 rejects (reserved `otel.` prefix,
        non-lowercase, placeholders) are reported.
  v3:
    status: rewritten
    output: [MeshAccessLog, MeshOpenTelemetryBackend]
    notes: |
      v2 rewrites, plus each inline `openTelemetry.endpoint` is replaced by
      `backendRef: {kind: MeshOpenTelemetryBackend, labels: {kuma.io/display-name: <name>-otel}}`
      and a matching `MeshOpenTelemetryBackend` is generated (in the system namespace on
      Kubernetes, see [Meshes](../topics/meshes.md#system-namespace); protocol `grpc`). Apply
      the backend before the policy. Allowed `to[].targetRef.kind`:
      `Mesh`, `MeshService`, `MeshExternalService`, `MeshMultiZoneService`, `MeshHTTPRoute`.
  timeline:
    - version: "2.10"
      change: "`rules[]` API added; `from[]` deprecated."
    - version: "2.14"
      change: Inline `openTelemetry.endpoint` deprecated; attribute keys validated.
    - version: "3.0"
      change: "`from` and the inline OpenTelemetry `endpoint` removed."
  topics: [observability, policy-targeting]
  code: [pkg/migrator/rulesapi.go, pkg/migrator/deprecation.go, pkg/migrator/v3_mesh.go]

- kind: MeshTrace
  group: mesh
  product: kuma
  summary: Distributed tracing configuration for selected proxies.
  v2:
    status: warned
    output: [MeshTrace]
    notes: |
      Copied unchanged. An inline `openTelemetry.endpoint` is reported (deprecated in 2.14,
      removed in 3.0) with the `backendRef` constraints: labels only, mutually exclusive with
      `endpoint`, backend in the system namespace, empty `endpoint.path` with `grpc`.
  v3:
    status: rewritten
    output: [MeshTrace, MeshOpenTelemetryBackend]
    notes: |
      The inline endpoint is replaced by a `backendRef` and a generated
      [MeshOpenTelemetryBackend](policy:MeshOpenTelemetryBackend) named `<policy>-otel`.
      `MeshTrace` has no `to[]` on 3.0; one present is reported.
  timeline:
    - version: "2.14"
      change: Inline `openTelemetry.endpoint` deprecated.
    - version: "3.0"
      change: Inline OpenTelemetry `endpoint` removed.
  topics: [observability]
  code: [pkg/migrator/deprecation.go, pkg/migrator/v3_mesh.go]

- kind: MeshMetric
  group: mesh
  product: kuma
  summary: Metrics exposure for selected proxies (Prometheus or OpenTelemetry).
  v2:
    status: rewritten
    output: [MeshMetric]
    notes: |
      - `default.sidecar.regex` → `default.sidecar.profiles.exclude` (auto-fixed).
      - An inline `openTelemetry.endpoint` is reported (deprecated in 2.14, removed in 3.0).
  v3:
    status: rewritten
    output: [MeshMetric, MeshOpenTelemetryBackend]
    notes: |
      v2 fix, plus the inline OTel endpoint is replaced by a `backendRef` and a generated
      [MeshOpenTelemetryBackend](policy:MeshOpenTelemetryBackend).

      `prometheus.tls.mode: ActiveMTLSBackend` is reported: on 3.0 a scraper connecting from
      another address must present a client certificate the mesh trusts. Give each remote
      scraper one, or set the mode to `Disabled`.
  timeline:
    - version: "2.7"
      change: "`sidecar.regex` replaced by `sidecar.profiles.exclude`."
    - version: "2.14"
      change: Inline `openTelemetry.endpoint` deprecated.
    - version: "3.0"
      change: Inline OpenTelemetry `endpoint` removed. `ActiveMTLSBackend` requires a client certificate from remote scrapers.
  topics: [observability]
  code: [pkg/migrator/deprecation.go, pkg/migrator/v3_mesh.go]

- kind: MeshProxyPatch
  group: mesh
  product: kuma
  summary: Appends raw Envoy modifications to the generated configuration of selected proxies.
  v2:
    status: passthrough
    output: [MeshProxyPatch]
    notes: |
      Copied unchanged. A cluster patch on `circuitBreakers` is reported: on 3.0 it merges into
      the existing threshold and overrides `MeshCircuitBreaker`, where before it was ignored.
      A deprecated top-level kind is reported.
  v3:
    status: warned
    output: [MeshProxyPatch]
    notes: |
      Same `circuitBreakers` warning. A top-level `MeshService` ref is rewritten to labels and
      reported, because 3.0 accepts only `Mesh` and `Dataplane` there. Control-plane labels are
      removed.
  timeline:
    - version: "3.0"
      change: Circuit-breaker patches merge into the existing threshold instead of appending a dead one.
  topics: [policy-targeting]
  code: [pkg/migrator/v3_policy.go, pkg/migrator/deprecation.go]

- kind: MeshLoadBalancingStrategy
  group: mesh
  product: kuma
  summary: Load-balancing algorithm, hash policies and locality awareness for outbound traffic.
  v2:
    status: rewritten
    output: [MeshLoadBalancingStrategy]
    notes: |
      - `to[].default.loadBalancer.{ringHash,maglev}.hashPolicies` → `to[].default.hashPolicies`
        (auto-fixed).
      - `hashPolicies[].type: SourceIP` → `type: Connection` with `connection.sourceIP: true`
        (auto-fixed, at either location). 2.14 accepts `SourceIP` but builds no Envoy hash
        policy from it, so source-IP hashing starts to take effect once the output is applied;
        the warning says so.
  v3:
    status: rewritten
    output: [MeshLoadBalancingStrategy]
    notes: |
      v2 rewrites (3.0 removes `SourceIP` from the enum and rejects it), plus:

      - `to[].default.localityAwareness.crossZone` on an entry whose `targetRef.kind` is not
        `MeshMultiZoneService` is reported; 3.0 rejects it.
      - Labels-only refs and control-plane label removal. Allowed `to[].targetRef.kind`:
        `Mesh`, `MeshService`, `MeshExternalService`, `MeshMultiZoneService`, `MeshHTTPRoute`.
  timeline:
    - version: "2.10"
      change: "`hashPolicies.type: SourceIP` removed."
    - version: "3.0"
      change: Load-balancer-specific `hashPolicies` removed. `crossZone` requires a `MeshMultiZoneService` target.
  topics: [multizone, policy-targeting]
  code: [pkg/migrator/deprecation.go, pkg/migrator/v3_policy.go]

- kind: MeshPassthrough
  group: mesh
  product: kuma
  summary: Controls which destinations outside the mesh transparent-proxy traffic may reach.
  v2:
    status: warned
    output: [MeshPassthrough]
    notes: |
      Copied unchanged. `appendMatch[]` entries 2.14 rejects are reported: partial wildcards
      (`*foo.com`), `type: Domain` with `tcp`/`mysql`, and a wildcard domain on an L7 protocol
      without a port. Matches that resolve to the same Envoy filter chain are reported too.
  v3:
    status: warned
    output: [MeshPassthrough]
    notes: |
      v2 checks, plus a non-wildcard `type: Domain` match without a `port` is reported (3.0
      resolves the domain itself and needs the port).

      A `Mesh` with `networking.outbound.passthrough: true` gets a companion
      `MeshPassthrough` with `passthroughMode: All` (see [Mesh](policy:Mesh)): 3.0 drops
      external traffic for any transparent-proxy data plane no `MeshPassthrough` selects.
  timeline:
    - version: "2.10"
      change: Kubernetes and Universal default `passthroughMode` unified.
    - version: "2.14"
      change: Partial wildcards and invalid domain/protocol combinations rejected.
    - version: "3.0"
      change: Domain matches need a port; colliding filter chains rejected; outbound passthrough defaults to `None`.
  topics: [external-services]
  code: [pkg/migrator/deprecation.go, pkg/migrator/v3_scan.go]

- kind: MeshTLS
  group: mesh
  product: kuma
  summary: TLS mode (Strict/Permissive), versions and ciphers for mesh traffic.
  v2:
    status: rewritten
    output: [MeshTLS]
    notes: |
      `from[]` → `rules[]` (see [MeshTimeout](policy:MeshTimeout)). The 2.9-era `from[]`
      shape is converted; the client selector is dropped.
  v3:
    status: rewritten
    output: [MeshTLS]
    notes: |
      Same rewrite plus control-plane label removal. On 3.0 an unconverted `from` is dropped
      silently, which can flip inbounds between strict and permissive.

      A `Mesh` whose enabled mTLS backend is `PERMISSIVE` gets a companion `MeshTLS`
      `<mesh>-tls-permissive` with `rules[].default.mode: Permissive` (see [Mesh](policy:Mesh)).
  timeline:
    - version: "2.10"
      change: "`rules[]` API added; `from[]` deprecated."
    - version: "3.0"
      change: "`from` removed and silently ignored. Only `MeshTLS` decides whether an inbound accepts plaintext."
  topics: [mtls-identity]
  code: [pkg/migrator/rulesapi.go, pkg/migrator/v3_mesh.go]

- kind: MeshHTTPRoute
  group: mesh
  product: kuma
  summary: HTTP routing (matches, filters, weighted backends) for outbound traffic to a service.
  v2:
    status: passthrough
    output: [MeshHTTPRoute]
    notes: |
      Not converted: `MeshHTTPRoute` survives 3.0 and is what Kuma compiles Gateway API
      `HTTPRoute`/`GRPCRoute` into. A `MeshServiceSubset` `backendRefs[].kind` is reported
      (rejected on 3.0; split the destination into separate `MeshService` resources).
  v3:
    status: rewritten
    output: [MeshHTTPRoute]
    notes: |
      - `to[].targetRef` and `backendRefs[]` `name`/`namespace`/`mesh` → labels.
      - Route with no catch-all rule (empty `matches[]` or `PathPrefix: /`) is reported: on
        3.0 an unmatched request gets a `404` across every HTTP port of the destination.
      - `MeshServiceSubset` backendRefs are reported.
      - A `backendRefs[]` entry whose `port` or `sectionName` matches no port of the
        `MeshService` in the input (by name or port number, never `targetPort`) is reported:
        on 3.0 it is unresolved instead of falling through to another port, and a rule whose
        backendRefs are all unresolved answers `500`. A `MeshService` missing from the input is
        noted once per run.
      - Allowed `to[].targetRef.kind`: `MeshService`, `MeshExternalService`,
        `MeshMultiZoneService`.

      The `targetRef` matrix is in [Policy targeting](../topics/policy-targeting.md#kinds-accepted-per-policy).
  timeline:
    - version: "3.0"
      change: Unmatched requests get a `404`. `MeshServiceSubset` backendRefs rejected. Real resources selected by labels only. A backendRef naming a port the destination lacks fails closed.
  topics: [gateways, policy-targeting]
  code: [pkg/migrator/deprecation.go, pkg/migrator/v3_policy.go, pkg/migrator/v3_gateway.go, pkg/migrator/v3_routeports.go]

- kind: MeshTCPRoute
  group: mesh
  product: kuma
  summary: TCP routing and weighted backends for outbound traffic to a service.
  v2:
    status: passthrough
    output: [MeshTCPRoute]
    notes: |
      Copied unchanged. Kuma has no Gateway API `TCPRoute` reconciler, so this is not
      converted to Gateway API.
  v3:
    status: rewritten
    output: [MeshTCPRoute]
    notes: |
      `to[].targetRef` and `backendRefs[]` `name`/`namespace`/`mesh` → labels;
      `MeshServiceSubset` backendRefs reported. Allowed `to[].targetRef.kind`: `MeshService`,
      `MeshExternalService`, `MeshMultiZoneService`.
  timeline:
    - version: "3.0"
      change: "`MeshServiceSubset` backendRefs rejected. Real resources selected by labels only."
  topics: [policy-targeting]
  code: [pkg/migrator/v3_policy.go, pkg/migrator/v3_gateway.go]

- kind: MeshTrust
  group: mesh
  product: kuma
  summary: CA bundles trusted for a trust domain, used with MeshIdentity.
  v2:
    status: warned
    output: [MeshTrust]
    notes: |
      `spec.origin` is reported: removed in 2.13 from the API and the CRD schema, so a strict
      apply can reject it. The value is published read-only at `status.origin.kri`. Remove
      `spec.origin`.
  v3:
    status: warned
    output: [MeshTrust]
    notes: |
      Same check. Control-plane-owned labels are removed.
  timeline:
    - version: "2.13"
      change: "`spec.origin` removed; value moved to `status.origin`."
    - version: "3.0"
      change: The legacy mesh CA is no longer added to the `MeshTrust` bundle.
  topics: [mtls-identity]
  code: [pkg/migrator/deprecation.go]

- kind: MeshIdentity
  group: mesh
  product: kuma
  summary: Workload identity (SPIFFE ID and certificate provider) for selected proxies.
  v2:
    status: passthrough
    output: [MeshIdentity]
    notes: |
      Copied unchanged. The migrator never generates a `MeshIdentity`: moving off
      `Mesh.spec.mtls` is a CA cutover whose trust domain, SPIFFE paths and key material are
      not in the manifests. See [Mesh](policy:Mesh) for the advisory.

      Every `MeshIdentity` in the input is indexed by mesh, for the `MeshExternalService` check
      under v3.
  v3:
    status: passthrough
    output: [MeshIdentity]
    notes: |
      Copied unchanged apart from control-plane label removal. Its presence suppresses the
      [MeshExternalService](policy:MeshExternalService) "no MeshIdentity" warning for that
      mesh.
  timeline:
    - version: "2.12"
      change: "`MeshIdentity` and `MeshTrust` introduced as the successor to `Mesh.spec.mtls`."
    - version: "3.0"
      change: "`spec.spiffeID` is immutable and its trust domain no longer follows the zone. `MeshExternalService` clusters require a `MeshIdentity`."
  topics: [mtls-identity]
  code: [pkg/migrator/legacybackend.go, pkg/migrator/v3_mes.go]

# ---------------------------------------------------------------------------
# Kong Mesh
# ---------------------------------------------------------------------------

- kind: OPAPolicy
  group: kong-mesh
  product: kong-mesh
  summary: Legacy Kong Mesh Open Policy Agent authorization policy.
  v2:
    status: converted
    output: [MeshOPA]
    notes: |
      | `OPAPolicy` | `MeshOPA` |
      |---|---|
      | `conf.policies[].inlineString` / `.inline` / `.secret` | `spec.default.appendPolicies[].rego.*` (same key) |
      | `conf.agentConfig.inlineString` / `.inline` / `.secret` | `spec.default.agentConfig.*` (same key) |
      | other `conf` fields | `spec.default.*`, with a warning |
      | `selectors[]` | `spec.targetRef` (`kuma.io/service: '*'` → `Mesh`); several selectors split into one `MeshOPA` each |
      | top-level `mesh` (Kubernetes layout) | `metadata.labels["kuma.io/mesh"]` |
      | no namespace (`OPAPolicy` is cluster-scoped) | `metadata.namespace`: the control-plane namespace, so the CP gives the `MeshOPA` the `system` role ([Namespace on Kubernetes](../topics/legacy-policies.md#namespace-on-kubernetes)) |

      The output keeps the flat DataSource shape, which the 2.x `MeshOPA` accepts for all three
      keys (`inline` stays base64). A `policies[]` entry or `agentConfig` with none of the three
      keys is left out with a "NOT migrated" warning instead of being emitted as an empty
      `rego: {}`; unrecognised extra keys are reported as dropped. The output then gets the
      [MeshOPA](policy:MeshOPA) v2 advisories.
  v3:
    status: converted
    output: [MeshOPA]
    notes: |
      Same conversion, then the [MeshOPA](policy:MeshOPA) v3 rewrites: DataSources to
      `SecureDataSource` (a base64 `inline` is decoded into `insecureInline.value`),
      `targetRef.name`/`namespace`/`mesh` to labels. The source object is
      listed under "Delete Before Upgrading to 3.0".
  timeline:
    - version: "2.13"
      change: Non-functional under the default dynamic-config OPA runtime (opt out with `KMESH_OPA_EXPERIMENTAL_USE_DYNAMIC_CONFIG=false` on the data plane).
    - version: "3.0"
      change: Removed with its CRD. Leftover objects are rejected.
  topics: [access-control]
  code: [pkg/migrator/opapolicy.go, pkg/migrator/namespace.go]

- kind: MeshOPA
  group: kong-mesh
  product: kong-mesh
  summary: Kong Mesh targetRef policy that runs OPA rego authorization on selected proxies.
  v2:
    status: warned
    output: [MeshOPA]
    notes: |
      Copied unchanged, with forward-looking advisories:

      - `spec.targetRef.{name,namespace,mesh}` are removed in 3.0. Dropping `name` widens the
        policy to every proxy matching `kind`.
      - `spec.targetRef.kind: MeshService` is rejected in 3.0; plan `kind: Dataplane` with
        `labels: {app: <svc>}`.
      - `agentConfig` and `appendPolicies[].rego` in the flat DataSource shape
        (`inline`/`inlineString`/`secret`) must become `SecureDataSource`.
  v3:
    status: rewritten
    output: [MeshOPA]
    notes: |
      Rewritten in this order:

      1. `targetRef.kind: MeshService` → `Dataplane`, and a `kuma.io/display-name` label is
         renamed to `app`.
      2. `targetRef.name` → a label (`app` for `Dataplane`), keeping the scope. An existing
         conflicting label blocks the move and is reported. `namespace` and `mesh` are dropped.
      3. DataSources → `SecureDataSource`: `inlineString` and base64-decoded `inline` →
         `type: InsecureInline` + `insecureInline.value`; `secret` →
         `type: Secret` + `secretRef: {kind: Secret, name}`.

      Rego and agent config are not credentials, so decoding `inline` is done automatically.
      Verify the `app` label matches the target pods.
  timeline:
    - version: "3.0"
      change: "`targetRef.{name,namespace,mesh}` removed; `targetRef.kind` limited to `Mesh` and `Dataplane`; DataSources use `SecureDataSource`."
  topics: [access-control, policy-targeting]
  code: [pkg/migrator/opapolicy.go, pkg/migrator/deprecation.go]

- kind: MeshGlobalRateLimit
  group: kong-mesh
  product: kong-mesh
  summary: Kong Mesh rate limiting backed by an external rate-limit service shared across proxies.
  v2:
    status: warned
    output: [MeshGlobalRateLimit]
    notes: |
      Copied unchanged with an advisory: removed in 3.0 with no in-mesh replacement. A leftover
      object is not rejected; it enforces nothing. Plan rate limiting at the gateway or with
      `MeshRateLimit`.
  v3:
    status: removed
    output: []
    notes: |
      Copied to `_manual/`, not to the apply tree, and listed under
      "Delete Before Upgrading to 3.0". Remove the `ratelimit.*` / `global.ratelimit.*` Helm
      overrides, and delete the `meshglobalratelimits.kuma.io` CRD after upgrading (Helm leaves
      it in place).
  timeline:
    - version: "3.0"
      change: Removed with its control-plane support, the Helm rate-limit service and the `KMESH_GLOBAL_RATE_LIMIT_*` settings. Leftover objects become inert.
  topics: [access-control]
  code: [pkg/migrator/deprecation.go, pkg/migrator/v3_kongmesh.go]

- kind: AccessRole
  group: kong-mesh
  product: kong-mesh
  summary: Kong Mesh RBAC role listing resource types and qualifiers a subject may access.
  v2:
    status: warned
    output: [AccessRole]
    notes: |
      Scanned in both environments (not on the default skip list). Advisories for 3.0:

      - `rules[].types` naming a removed type (legacy policies, `MeshGateway*`, …) is rejected
        with `unknown types`.
      - `when[].targetRef.kind` other than `Mesh`/`Dataplane` is rejected.
      - A `when[]` entry that only sets `sources`/`destinations`/`selectors` is rejected with
        `qualifier cannot be empty`.
  v3:
    status: rewritten
    output: [AccessRole]
    notes: |
      - `rules[].types`: legacy types renamed to their Mesh* successor
        (`TrafficPermission` → `MeshTrafficPermission`, …), types with no successor removed,
        duplicates collapsed.
      - `when[]` entries with only legacy qualifiers are removed. The other qualifiers are kept,
        so the grant does not widen.
      - A rule mixing targetRef policies with other types is reported (3.0 rejects it); split
        it by hand.
      - `when[].targetRef.kind: MeshService` is reported, not converted: the label set is not in
        the manifest.
  timeline:
    - version: "3.0"
      change: Removed types and the `sources`/`destinations`/`selectors` qualifiers rejected; `when[].targetRef` limited to `Mesh` and `Dataplane`.
  topics: [access-control]
  code: [pkg/migrator/v3_kongmesh.go, pkg/config/config.go]

- kind: AccessRoleBinding
  group: kong-mesh
