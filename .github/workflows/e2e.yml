name: E2E (real control planes)

# Migrates test/e2e/fixtures and applies the output to real Kong Mesh control planes:
# 2.14 for --to-latest v2, 3.0 for --to-latest v3. Kubernetes CPs run in kind, Universal
# CPs in Docker. See test/e2e/README.md.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  pull_request:
    branches: [main]
    paths:
      - 'pkg/migrator/**'
      - 'pkg/extractor/**'
      - 'test/e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        env: [kubernetes, universal]
    env:
      E2E_PLATFORM: kind
      E2E_ENVS: ${{ matrix.env }}
      # The runner context is not available in job-level env; github.workspace is.
      E2E_WORK: ${{ github.workspace }}/.e2e-work
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        if: matrix.env == 'kubernetes'
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          kind version

      - name: Create control planes
        run: test/e2e/run.sh up

      - name: Migrate and apply
        run: test/e2e/run.sh test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.env }}
          path: |
            test/e2e/results/
            .e2e-work/out/
            .e2e-work/*.log
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: test/e2e/run.sh down
