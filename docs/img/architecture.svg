<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="kuma-migrator pipeline: extract reads the control plane into an input tree, and the optional preflight audit adds its report there; migrate runs a pre-pass, then for each document the skip list, scenario detection, the transform and the deprecation scan, and writes the apply tree, the _manual subtree and the report" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" color="#1f2328">
<title>kuma-migrator pipeline</title>
<style>
@media (prefers-color-scheme: dark) { svg { color: #e6edf3; } }
</style>
<defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.2">
<rect x="230" y="10" width="300" height="44" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="130" y="110" width="360" height="60" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="510" y="110" width="210" height="60" rx="6" fill="currentColor" fill-opacity="0.06" stroke-dasharray="4 3"/>
<rect x="90" y="210" width="630" height="60" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="40" y="300" width="680" height="196" rx="8" stroke-dasharray="6 4" stroke-opacity="0.6"/>
<rect x="400" y="330" width="300" height="56" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="70" y="420" width="120" height="56" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="206" y="420" width="140" height="56" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="362" y="420" width="160" height="56" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="538" y="420" width="160" height="56" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="70" y="530" width="200" height="56" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="290" y="530" width="180" height="56" rx="6" fill="currentColor" fill-opacity="0.06" stroke-dasharray="4 3"/>
<rect x="490" y="530" width="230" height="56" rx="6" fill="currentColor" fill-opacity="0.06"/>
</g>
<g stroke="currentColor" stroke-width="1.2" marker-end="url(#arch-arrow)">
<line x1="310" y1="54" x2="310" y2="108"/>
<line x1="450" y1="54" x2="450" y2="108"/>
<line x1="520" y1="54" x2="600" y2="108"/>
<line x1="310" y1="170" x2="310" y2="208"/>
<line x1="615" y1="170" x2="615" y2="208"/>
<line x1="150" y1="270" x2="150" y2="418"/>
<line x1="560" y1="270" x2="560" y2="328"/>
<line x1="442" y1="386" x2="442" y2="418"/>
<line x1="190" y1="448" x2="204" y2="448"/>
<line x1="346" y1="448" x2="360" y2="448"/>
<line x1="522" y1="448" x2="536" y2="448"/>
<line x1="600" y1="476" x2="200" y2="528"/>
<line x1="610" y1="476" x2="400" y2="528"/>
<line x1="620" y1="476" x2="605" y2="528"/>
</g>
<g fill="currentColor" font-size="13" text-anchor="middle">
<text x="380" y="37" font-weight="600">Control plane (Global, Zone, Konnect)</text>
<text x="310" y="135" font-weight="600">extract</text>
<text x="310" y="156" font-size="12" fill-opacity="0.75">mode detection · origin filter · skip list</text>
<text x="615" y="135" font-weight="600">--preflight (optional)</text>
<text x="615" y="156" font-size="12" fill-opacity="0.75">3.0 audit: versions · settings · zones</text>
<text x="405" y="235" font-weight="600">Input tree</text>
<text x="405" y="256" font-size="12" fill-opacity="0.75">&lt;ctx&gt;-&lt;mode&gt;-ctx/mesh-&lt;mesh&gt;/&lt;sub&gt;/*.yaml · .kuma-migrator.json · v3-preflight.json</text>
<text x="550" y="354" font-weight="600">Pre-pass: BuildTransformOptions</text>
<text x="550" y="374" font-size="12" fill-opacity="0.75">Mesh backends · GatewayClasses · MeshIdentity</text>
<text x="130" y="444" font-weight="600">Skip list</text>
<text x="130" y="463" font-size="12" fill-opacity="0.75">per environment</text>
<text x="276" y="444" font-weight="600">DetectScenario</text>
<text x="276" y="463" font-size="12" fill-opacity="0.75">one per document</text>
<text x="442" y="444" font-weight="600">Transform</text>
<text x="442" y="463" font-size="12" fill-opacity="0.75">+ v3 companions</text>
<text x="618" y="444" font-weight="600">ScanForDeprecations</text>
<text x="618" y="463" font-size="12" fill-opacity="0.75">every output document</text>
<text x="170" y="554" font-weight="600">Apply tree</text>
<text x="170" y="573" font-size="12" fill-opacity="0.75">&lt;ctx&gt;/mesh-&lt;mesh&gt;/&lt;sub&gt;/</text>
<text x="380" y="554" font-weight="600">_manual/</text>
<text x="380" y="573" font-size="12" fill-opacity="0.75">v3 only, never applied</text>
<text x="605" y="554" font-weight="600">migration-report.md</text>
<text x="605" y="573" font-size="12" fill-opacity="0.75">plan with --dry-run · audit summary</text>
</g>
<g fill="currentColor" font-size="12" fill-opacity="0.75">
<text x="300" y="86" text-anchor="end">kubectl: kuma.io CRDs</text>
<text x="460" y="86">kumactl /_resources · Konnect HTTPS</text>
<text x="56" y="320" font-weight="600" fill-opacity="1">migrate</text>
</g>
</svg>
