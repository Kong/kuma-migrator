<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 195" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>kuma-migrator pipeline: extract, migrate, apply</title>
  <desc>Three steps. Extract pulls resources from a running control plane; with --preflight it also runs the 3.0 readiness audit of that control plane. Migrate writes the migrated manifests and a report, which summarises the audit when one was run. Apply is manual.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f6f8fa;
      --rule: #d0d7de;
      --title: #1f2328;
      --muted: #6e7781;
      --accent: #6639ba;
      --manual: #9a6700;
      --manual-bg: #fff8c5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --rule: #30363d;
        --title: #e6edf3;
        --muted: #8b949e;
        --accent: #b083f0;
        --manual: #e3b341;
        --manual-bg: #2b2111;
      }
    }
    .card { fill: var(--card-bg); stroke: var(--rule); stroke-width: 1.5; }
    .card-manual { fill: var(--manual-bg); stroke: var(--manual); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .step-badge { fill: var(--accent); }
    .step-badge-manual { fill: var(--manual); }
    .step-num { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cmd { font-family: SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; font-size: 16px; font-weight: 700; fill: var(--accent); }
    .cmd-manual { font-family: SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; font-size: 16px; font-weight: 700; fill: var(--manual); }
    .desc { font-size: 11.5px; fill: var(--muted); }
    .tag { font-size: 9px; font-weight: 700; letter-spacing: .04em; fill: var(--manual); }
    .arrow { stroke: var(--muted); stroke-width: 1.5; }
    .chip { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .chip-flag { font-family: SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; font-size: 11px; font-weight: 700; fill: var(--accent); }
    .chip-desc { font-size: 11px; fill: var(--muted); }
  </style>

  <rect x="0" y="0" width="1000" height="195" fill="var(--bg)"/>

  <defs>
    <marker id="pipe-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- Box 1: extract (x=40..310) -->
  <rect class="card" x="40" y="50" width="270" height="128" rx="8"/>
  <circle class="step-badge" cx="62" cy="72" r="11"/>
  <text class="step-num" x="62" y="76">1</text>
  <text class="cmd" x="56" y="98">extract</text>
  <text class="desc" x="56" y="120">Pull resources from a running control plane</text>
  <text class="desc" x="56" y="135">writes one YAML file per resource</text>
  <rect class="chip" x="56" y="146" width="238" height="20" rx="10"/>
  <text class="chip-flag" x="68" y="160">--preflight</text>
  <text class="chip-desc" x="148" y="160">+ 3.0 audit of the CP</text>

  <!-- Box 2: migrate (x=365..635) -->
  <rect class="card" x="365" y="50" width="270" height="128" rx="8"/>
  <circle class="step-badge" cx="387" cy="72" r="11"/>
  <text class="step-num" x="387" y="76">2</text>
  <text class="cmd" x="381" y="98">migrate</text>
  <text class="desc" x="381" y="120">Write migrated manifests</text>
  <text class="desc" x="381" y="135">+ report (--dry-run to preview)</text>
  <text class="desc" x="381" y="160">the report summarises the audit, if run</text>

  <!-- Box 3: apply (x=690..960) — visually distinct: manual, not a kuma-migrator command -->
  <rect class="card-manual" x="690" y="50" width="270" height="128" rx="8"/>
  <text class="tag" x="952" y="66" text-anchor="end">MANUAL STEP</text>
  <circle class="step-badge-manual" cx="712" cy="72" r="11"/>
  <text class="step-num" x="712" y="76">3</text>
  <text class="cmd-manual" x="706" y="98">apply</text>
  <text class="desc" x="706" y="120">kubectl / kumactl apply,</text>
  <text class="desc" x="706" y="135">in the order the report gives</text>

  <line class="arrow" x1="316" y1="114" x2="359" y2="114" marker-end="url(#pipe-arrowhead)"/>
  <line class="arrow" x1="641" y1="114" x2="684" y2="114" marker-end="url(#pipe-arrowhead)"/>
</svg>
