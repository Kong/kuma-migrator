<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>kuma-migrator pipeline: extract, plan, migrate, apply</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f6f8fa;
      --rule: #d0d7de;
      --title: #1f2328;
      --muted: #6e7781;
      --accent: #6639ba;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --rule: #30363d;
        --title: #e6edf3;
        --muted: #8b949e;
        --accent: #b083f0;
      }
    }
    .card { fill: var(--card-bg); stroke: var(--rule); stroke-width: 1.5; }
    .step-badge { fill: var(--accent); }
    .step-num { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cmd { font-family: SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; font-size: 16px; font-weight: 700; fill: var(--accent); }
    .desc { font-size: 11.5px; fill: var(--muted); }
    .arrow { stroke: var(--muted); stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="1000" height="180" fill="var(--bg)"/>

  <defs>
    <marker id="pipe-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- Box 1: extract (x=40..225) -->
  <rect class="card" x="40" y="50" width="185" height="110" rx="8"/>
  <circle class="step-badge" cx="62" cy="72" r="11"/>
  <text class="step-num" x="62" y="76">1</text>
  <text class="cmd" x="56" y="98">extract</text>
  <text class="desc" x="56" y="120">Pull resources from a</text>
  <text class="desc" x="56" y="135">running control plane</text>

  <!-- Box 2: plan (x=285..470) -->
  <rect class="card" x="285" y="50" width="185" height="110" rx="8"/>
  <circle class="step-badge" cx="307" cy="72" r="11"/>
  <text class="step-num" x="307" y="76">2</text>
  <text class="cmd" x="301" y="98">plan</text>
  <text class="desc" x="301" y="120">Preview every change —</text>
  <text class="desc" x="301" y="135">no YAML written</text>

  <!-- Box 3: migrate (x=530..715) -->
  <rect class="card" x="530" y="50" width="185" height="110" rx="8"/>
  <circle class="step-badge" cx="552" cy="72" r="11"/>
  <text class="step-num" x="552" y="76">3</text>
  <text class="cmd" x="546" y="98">migrate</text>
  <text class="desc" x="546" y="120">Write the migrated</text>
  <text class="desc" x="546" y="135">manifests + report</text>

  <!-- Box 4: apply (x=775..960) -->
  <rect class="card" x="775" y="50" width="185" height="110" rx="8"/>
  <circle class="step-badge" cx="797" cy="72" r="11"/>
  <text class="step-num" x="797" y="76">4</text>
  <text class="cmd" x="791" y="98">apply</text>
  <text class="desc" x="791" y="120">Apply in the order</text>
  <text class="desc" x="791" y="135">the report gives</text>

  <line class="arrow" x1="231" y1="105" x2="279" y2="105" marker-end="url(#pipe-arrowhead)"/>
  <line class="arrow" x1="476" y1="105" x2="524" y2="105" marker-end="url(#pipe-arrowhead)"/>
  <line class="arrow" x1="721" y1="105" x2="769" y2="105" marker-end="url(#pipe-arrowhead)"/>
</svg>
