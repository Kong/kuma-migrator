type: MeshGatewayRoute
name: edge-http
mesh: default
selectors:
- match:
    kuma.io/service: edge-gateway
    port: http-8080
conf:
  http:
    rules:
    - matches:
      - path:
          match: PREFIX
          value: /api
      filters:
      - requestHeader:
          add:
          - name: x-gateway
            value: edge
      backends:
      - destination:
          kuma.io/service: backend
        weight: 100
    - matches:
      - path:
          match: PREFIX
          value: /
      backends:
      - destination:
          kuma.io/service: frontend
