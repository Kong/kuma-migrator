type: HealthCheck
name: hc-web
mesh: default
sources:
- match:
    kuma.io/service: frontend
destinations:
- match:
    kuma.io/service: backend
conf:
  interval: 10s
  timeout: 2s
  unhealthyThreshold: 3
  healthyThreshold: 1
  initialJitter: 5s
  intervalJitter: 6s
  intervalJitterPercent: 10
  healthyPanicThreshold: 60
  failTrafficOnPanic: true
  eventLogPath: /tmp/health-check.log
  alwaysLogHealthCheckFailures: true
  noTrafficInterval: 10s
  http:
    path: /health
    requestHeadersToAdd:
    - append: false
      header:
        key: Content-Type
        value: application/json
    - header:
        key: Accept
        value: application/json
    expectedStatuses:
    - 200
    - 201
