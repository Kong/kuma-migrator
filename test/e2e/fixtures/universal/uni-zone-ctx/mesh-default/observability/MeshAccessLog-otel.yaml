type: MeshAccessLog
name: otel-logs
mesh: default
labels:
  kuma.io/origin: zone
spec:
  targetRef:
    kind: Mesh
  to:
  - targetRef:
      kind: Mesh
    default:
      backends:
      - type: OpenTelemetry
        openTelemetry:
          endpoint: otel-collector.observability:4317
          body:
            kvlistValue:
              values:
              - key: mesh
                value:
                  stringValue: '%KUMA_MESH%'
          attributes:
          - key: service.name
            value: '%KUMA_SOURCE_SERVICE%'
