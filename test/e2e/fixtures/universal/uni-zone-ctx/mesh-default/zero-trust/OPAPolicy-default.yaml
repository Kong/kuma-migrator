type: OPAPolicy
name: opa-backend
mesh: default
selectors:
- match:
    kuma.io/service: backend
conf:
  agentConfig:
    inlineString: "decision_logs:\n  console: true\n"
  policies:
  - inlineString: 'package envoy.authz

      import input.attributes.request.http as http_request

      default allow = false

      allow { http_request.method == "GET" }

      '
