apiVersion: kuma.io/v1alpha1
kind: Timeout
mesh: default
metadata:
  name: timeout-backend
spec:
  sources:
  - match:
      kuma.io/service: frontend_kuma-demo_svc_8080
  destinations:
  - match:
      kuma.io/service: backend_kuma-demo_svc_3001
  conf:
    connectTimeout: 10s
    tcp:
      idleTimeout: 1h
    http:
      requestTimeout: 15s
      idleTimeout: 1h
      streamIdleTimeout: 30m
      maxStreamDuration: 0s
    grpc:
      streamIdleTimeout: 5m
      maxStreamDuration: 30m
