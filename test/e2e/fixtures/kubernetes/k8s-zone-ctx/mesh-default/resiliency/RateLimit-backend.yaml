apiVersion: kuma.io/v1alpha1
kind: RateLimit
mesh: default
metadata:
  name: rl-backend
spec:
  sources:
  - match:
      kuma.io/service: '*'
  destinations:
  - match:
      kuma.io/service: backend_kuma-demo_svc_3001
  conf:
    http:
      requests: 100
      interval: 1m
      onRateLimit:
        status: 423
        headers:
        - key: x-kuma-rate-limited
          value: "true"
          append: true
