apiVersion: kuma.io/v1alpha1
kind: TrafficRoute
mesh: default
metadata:
  name: backend-split
spec:
  sources:
  - match:
      kuma.io/service: frontend_kuma-demo_svc_8080
  destinations:
  - match:
      kuma.io/service: backend_kuma-demo_svc_3001
  conf:
    split:
    - weight: 90
      destination:
        kuma.io/service: backend_kuma-demo_svc_3001
        version: v1
    - weight: 10
      destination:
        kuma.io/service: backend_kuma-demo_svc_3001
        version: v2
