apiVersion: kuma.io/v1alpha1
kind: MeshGatewayRoute
mesh: default
metadata:
  name: edge-tcp
spec:
  selectors:
  - match:
      kuma.io/service: edge-gateway_kuma-demo_svc
      port: tcp-9000
  conf:
    tcp:
      rules:
      - backends:
        - destination:
            kuma.io/service: redis_kuma-demo_svc_6379
