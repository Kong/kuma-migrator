apiVersion: kuma.io/v1alpha1
kind: MeshGateway
mesh: default
metadata:
  name: edge-gateway
spec:
  selectors:
  - match:
      kuma.io/service: edge-gateway_kuma-demo_svc
  conf:
    listeners:
    - port: 8080
      protocol: HTTP
      hostname: '*'
      tags:
        port: http-8080
    - port: 8443
      protocol: HTTPS
      hostname: shop.example.com
      tls:
        mode: TERMINATE
        certificates:
        - secret: httpbin-ca
      tags:
        port: https-8443
    - port: 9000
      protocol: TCP
      tags:
        port: tcp-9000
