apiVersion: kuma.io/v1alpha1
kind: MeshMultiZoneService
metadata:
  name: backend-mz
  namespace: kong-mesh-system
  labels:
    kuma.io/mesh: default
    kuma.io/origin: zone
spec:
  selector:
    meshService:
      matchLabels:
        kuma.io/display-name: backend
  ports:
  - port: 3001
    appProtocol: http
