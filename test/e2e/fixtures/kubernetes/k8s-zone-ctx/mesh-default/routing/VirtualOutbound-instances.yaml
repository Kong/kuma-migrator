apiVersion: kuma.io/v1alpha1
kind: VirtualOutbound
mesh: default
metadata:
  name: instances
spec:
  selectors:
  - match:
      kuma.io/service: '*'
  conf:
    host: '{{.svc}}.{{.inst}}.mesh'
    port: '8080'
    parameters:
    - name: svc
      tagKey: kuma.io/service
    - name: inst
      tagKey: kuma.io/instance
