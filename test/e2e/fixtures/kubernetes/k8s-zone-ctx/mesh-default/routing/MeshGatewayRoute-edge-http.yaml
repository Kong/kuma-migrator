apiVersion: kuma.io/v1alpha1
kind: MeshGatewayRoute
mesh: default
metadata:
  name: edge-http
spec:
  selectors:
  - match:
      kuma.io/service: edge-gateway_kuma-demo_svc
      port: http-8080
  conf:
    http:
      rules:
      - matches:
        - path:
            match: PREFIX
            value: /api
        filters:
        - requestHeader:
            add:
            - name: x-gateway
              value: edge
        backends:
        - destination:
            kuma.io/service: backend_kuma-demo_svc_3001
          weight: 100
      - matches:
        - path:
            match: PREFIX
            value: /
        backends:
        - destination:
            kuma.io/service: frontend_kuma-demo_svc_8080
